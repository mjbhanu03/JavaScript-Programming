<!-- Create a javascript program capable of generating a random password which contains -->
<!-- atleast one lowercase, one uppercase, and one special character -->
<!-- Create a password class to achieve the same. -->

<html>
    <body>
        <h5 class="password"></h5>
    </body>

    <script>
        let special = ['!','#','$','%','&','*','+','-','?','@'] 

        let randomNumForSpecialChar = Math.floor(Math.random() * special.length)
        let randomSpecialChar = special[randomNumForSpecialChar]
        
        let randomNumForUpperChar = Math.floor(Math.random() * (90 - 65 + 1) + 65)
        let randomUpperChar = String.fromCharCode(randomNumForUpperChar)

        let lowerChar = []
        for(i = 0; i < 16; i++)
        {
            lowerChar[i] = String.fromCharCode(Math.floor(Math.random() * (122 - 96 + 1) + 96))
        }

        let randomlowercase = lowerChar.join('')
        let join = randomSpecialChar.concat(randomUpperChar, randomlowercase)
        console.log(join)
        
    </script>
</html>
