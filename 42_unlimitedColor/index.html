<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlimited Color Change</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Change Unlimited Color Game</h2>
  <h5>Color will automatically change after 1 second</h5>
  <h5>Just press stop to stop the changing color event and start button to start the event.</h5>

  <button type="submit" id="start">Start</button>
  <button type="submit" id="stop">Stop</button>
</body>
<script src="script.js"></script>
</html>
